<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Belladonna — Release Party</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f0ede8;
    --grain-opacity: 0.04;
    --shadow-color: rgba(60, 50, 40, 0.18);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    background-color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: var(--grain-opacity);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(180, 170, 158, 0.35) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .ticket-stage {
    perspective: 900px;
  }

  .ticket-wrap {
    width: min(640px, 90vw);
    transform-style: preserve-3d;
    will-change: transform;
    cursor: grab;
    user-select: none;
    border-radius: 10px;
    box-shadow:
      0 2px 4px var(--shadow-color),
      0 8px 24px rgba(60, 50, 40, 0.12),
      0 24px 60px rgba(60, 50, 40, 0.10);
    transition: box-shadow 0.3s ease;
  }

  .ticket-wrap:active { cursor: grabbing; }

  .ticket-wrap img {
    width: 100%;
    display: block;
    border-radius: 10px;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    background: transparent;
    border: 0.5px solid rgba(80, 70, 60, 0.3);
    color: rgba(80, 70, 60, 0.7);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover {
    background: rgba(80, 70, 60, 0.06);
    color: rgba(80, 70, 60, 1);
    border-color: rgba(80, 70, 60, 0.5);
  }

  .btn.active {
    background: rgba(80, 70, 60, 0.1);
    color: rgba(80, 70, 60, 1);
    border-color: rgba(80, 70, 60, 0.6);
  }

  .hint {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(80, 70, 60, 0.35);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  /* Float animation */
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  .floating .ticket-wrap {
    animation: float 4s ease-in-out infinite;
  }

  /* Entry animation */
  @keyframes reveal {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .scene { animation: reveal 1s ease both; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="ticket-stage" id="stage">
    <div class="ticket-wrap" id="ticket">
      <img src="billet.png" alt="Invitation Belladonna Release Party — 29.05.2026, Le Groove, Genève" />
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnSpin">Rotation</button>
    <button class="btn" id="btnFloat">Flottement</button>
    <button class="btn" id="btnReset">Reset</button>
  </div>

  <p class="hint" id="hint">Glisse pour orienter · 29.05.2026 · Le Groove</p>
</div>

<script>
  const ticket = document.getElementById('ticket');
  const stage  = document.getElementById('stage');

  let rotX = -2, rotY = 4;
  let velX = 0, velY = 0;
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let autoSpin = false;
  let spinAngle = 4;
  let floatOn = false;
  let raf;

  function applyTransform(extraY = 0) {
    ticket.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function loop() {
    if (autoSpin) {
      spinAngle += 0.35;
      rotY = spinAngle;
      rotX += (0 - rotX) * 0.03;
    } else if (!isDragging) {
      velX *= 0.94;
      velY *= 0.94;
      rotX += velX;
      rotY += velY;
      rotX = Math.max(-28, Math.min(28, rotX));
    }
    applyTransform();
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  // Mouse
  ticket.addEventListener('mousedown', e => {
    isDragging = true;
    lastX = e.clientX; lastY = e.clientY;
    velX = 0; velY = 0;
    if (autoSpin) stopSpin();
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    velY = dx * 0.28;
    velX = -dy * 0.28;
    rotY += velY;
    rotX += velX;
    rotX = Math.max(-30, Math.min(30, rotX));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  // Touch
  ticket.addEventListener('touchstart', e => {
    isDragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    velX = 0; velY = 0;
    if (autoSpin) stopSpin();
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    velY = dx * 0.28;
    velX = -dy * 0.28;
    rotY += velY;
    rotX += velX;
    rotX = Math.max(-30, Math.min(30, rotX));
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', () => { isDragging = false; });

  function stopSpin() {
    autoSpin = false;
    document.getElementById('btnSpin').classList.remove('active');
  }

  document.getElementById('btnSpin').addEventListener('click', function() {
    autoSpin = !autoSpin;
    this.classList.toggle('active', autoSpin);
    if (autoSpin) spinAngle = rotY;
  });

  document.getElementById('btnFloat').addEventListener('click', function() {
    floatOn = !floatOn;
    this.classList.toggle('active', floatOn);
    stage.classList.toggle('floating', floatOn);
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    rotX = -2; rotY = 4; velX = 0; velY = 0;
    autoSpin = false;
    document.getElementById('btnSpin').classList.remove('active');
  });
</script>
</body>
</html>
