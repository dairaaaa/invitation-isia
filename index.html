<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Belladonna — Release Party</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root { --bg: #000000; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: var(--bg);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.035;
    pointer-events: none;
    z-index: 0;
  }

  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── DESKTOP ── */
  .scene {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    animation: reveal 1.2s ease both;
  }

  .ticket-stage { perspective: 900px; }

  .ticket-wrap {
    width: min(960px, 94vw);
    transform-style: preserve-3d;
    will-change: transform;
    cursor: grab;
    user-select: none;
    border-radius: 10px;
    box-shadow:
      0 2px 8px rgba(255,255,255,0.04),
      0 12px 40px rgba(255,255,255,0.06),
      0 40px 80px rgba(0,0,0,0.6);
  }

  .ticket-wrap:active { cursor: grabbing; }

  .ticket-wrap img {
    width: 100%;
    display: block;
    border-radius: 10px;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .hint {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 300;
    white-space: nowrap;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── MOBILE ──
     Strategy: rotate the whole .scene by -90deg so the ticket
     appears in landscape orientation while the phone stays portrait.
     We fix .scene at center and swap its logical dimensions
     (width = 100vh, height = 100vw) so it fills the screen after rotation.
  */
  @media (max-width: 600px) {

    .scene {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vh;   /* becomes screen height after -90deg */
      height: 100vw;  /* becomes screen width after -90deg */
      transform: translate(-50%, -50%) rotate(-90deg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      animation: none;
      opacity: 1;
    }

    /* vmax = max(vw, vh), so on a portrait phone vmax = vh = screen height.
       We use it so the ticket spans most of the rotated "width" (= screen height). */
    .ticket-stage {
      width: 84vmax;
      perspective: 900px;
    }

    .ticket-wrap {
      width: 84vmax !important;
    }

    .hint {
      font-size: 10px;
      letter-spacing: 0.15em;
    }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="ticket-stage" id="stage">
    <div class="ticket-wrap" id="ticket">
      <img src="billet.png" alt="Invitation Belladonna Release Party — 29.05.2026, Le Groove, Genève" />
    </div>
  </div>
  <p class="hint">Vous êtes invité·e à la release party d'Isia Mendes.</p>
</div>

<script>
  const ticket = document.getElementById('ticket');

  let rotX = -2, rotY = 4;
  let velX = 0, velY = 0;
  let isDragging = false;
  let lastX = 0, lastY = 0;

  const MAX_Y = 70;
  const MAX_X = 28;

  function applyTransform() {
    ticket.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function loop() {
    if (!isDragging) {
      velX *= 0.94;
      velY *= 0.94;
      rotX += velX;
      rotY += velY;
      rotX = Math.max(-MAX_X, Math.min(MAX_X, rotX));
      rotY = Math.max(-MAX_Y, Math.min(MAX_Y, rotY));
    }
    applyTransform();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Mouse
  ticket.addEventListener('mousedown', e => {
    isDragging = true;
    lastX = e.clientX; lastY = e.clientY;
    velX = 0; velY = 0;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    velY = dx * 0.28; velX = -dy * 0.28;
    rotY += velY; rotX += velX;
    rotX = Math.max(-MAX_X, Math.min(MAX_X, rotX));
    rotY = Math.max(-MAX_Y, Math.min(MAX_Y, rotY));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  // Touch
  ticket.addEventListener('touchstart', e => {
    isDragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    velX = 0; velY = 0;
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    velY = dx * 0.28; velX = -dy * 0.28;
    rotY += velY; rotX += velX;
    rotX = Math.max(-MAX_X, Math.min(MAX_X, rotX));
    rotY = Math.max(-MAX_Y, Math.min(MAX_Y, rotY));
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', () => { isDragging = false; });
</script>
</body>
</html>
